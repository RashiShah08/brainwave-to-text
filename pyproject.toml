[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bwt"
version = "2.0.0"
description = "Brainwave-to-Text: an EEG motor-imagery decoder and mental-command speller"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rashi Shah" }]
keywords = ["eeg", "bci", "motor-imagery", "csp", "riemannian"]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "mne>=1.8",
    "pyriemann>=0.7",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bwt = "bwt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that touch the real dataset (deselect with '-m \"not slow\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]
